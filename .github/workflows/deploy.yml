# Builds the site and publishes it to GitHub Pages on every push to main.
# The repository is public, so Actions minutes on GitHub-hosted runners cost nothing.
name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - uses: actions/configure-pages@v6

      # Built for the site root: the docs live at https://ar-docs.wip-town.com (app/site.js), and the
      # repository's github.io address redirects there once the custom domain is set in its Pages settings.
      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Check the search index was written
        run: test -f out/_pagefind/pagefind.js

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
